<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calloway &amp; Sons — Fine Spirits</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pinyon+Script&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <header class="enseigne">
    <div class="enseigne-nom">Calloway &amp; Sons</div>
    <div class="enseigne-sous">Négociants en spiritueux fins à Gary, Indiana, depuis 1921</div>
  </header>
  <main id="app" aria-live="polite">
    <p class="chargement">Ouverture des registres…</p>
  </main>
  <footer class="pied">
    <span>Comptes professionnels sur recommandation uniquement.</span>
    <button id="deconnexion" class="lien-discret" hidden>Se déconnecter</button>
  </footer>
  <dialog id="visionneuse" aria-label="Photo agrandie">
    <img src="" alt="">
    <button type="button" class="visionneuse-fermer" data-fermer>Fermer</button>
  </dialog>
  <dialog id="dialogue" class="dialogue" aria-labelledby="dialogue-texte">
    <p class="dialogue-texte" id="dialogue-texte"></p>
    <div class="actions">
      <button type="button" class="bouton" data-ok>Confirmer</button>
      <button type="button" class="bouton-second" data-non>Annuler</button>
    </div>
  </dialog>
  <script type="module" src="app.js?v=17"></script>
</body>
</html>
